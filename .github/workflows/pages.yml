name: Deploy Pages
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm test
      - run: npm run build:pages
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-pages-validation-evidence
          if-no-files-found: error
          path: |
            tests/evidence/phase7be-test-result.json
            VALIDATION_STATUS.json
            FINAL_VALIDATION_STATUS.json
            RELEASE_MANIFEST.json
            PROTECTED_CORE_MANIFEST.json
      - name: Upload curated Pages payload for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-curated-site
          if-no-files-found: error
          path: _site
  browser_acceptance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/download-artifact@v4
        with:
          name: huf-phase7be-curated-site
          path: _site
      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium for acceptance
        run: npx playwright install --with-deps chromium
      - name: Run real-XLSX acceptance against curated Pages payload
        env:
          HUF_SITE_ROOT: _site
          HUF_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/phase7be-browser-acceptance.json
        run: node tests/browser/run-imp7b-browser-acceptance.mjs
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-pages-browser-acceptance
          if-no-files-found: error
          path: ${{ runner.temp }}/phase7be-browser-acceptance.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with: { path: './_site' }
  deploy:
    needs: browser_acceptance
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
