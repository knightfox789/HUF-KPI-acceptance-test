name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save --package-lock=false jszip@3.10.1 @xmldom/xmldom@0.9.12
      - run: npm test
      - run: npm run test:product
      - run: node tests/protected/run.mjs
      - run: node tests/protected/remaining80.mjs
      - run: node tests/protected/design6-summary.mjs
      - run: npm run build:pages
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-pages-validation-evidence
          if-no-files-found: error
          path: |
            tests/evidence/phase7be-test-result.json
            tests/evidence/product-flow.json
            tests/evidence/protected-regression.json
            tests/evidence/design6-remaining80.json
            tests/evidence/design6-logical.json
            tests/evidence/report-contract.json
            VALIDATION_STATUS.json
            FINAL_VALIDATION_STATUS.json
            RELEASE_MANIFEST.json
            PROTECTED_CORE_MANIFEST.json
      - name: Upload curated Pages payload for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-curated-site
          if-no-files-found: error
          path: _site
  browser_acceptance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/download-artifact@v4
        with:
          name: huf-phase7be-curated-site
          path: _site
      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium for acceptance
        run: npx playwright install --with-deps chromium
      - name: Run real-XLSX acceptance against curated Pages payload
        env:
          HUF_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
          HUF_SITE_ROOT: _site
          HUF_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/phase7be-browser-acceptance.json
        run: node tests/browser/run-imp7b-browser-acceptance.mjs
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huf-phase7be-pages-browser-acceptance
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/phase7be-browser-acceptance.json
            ${{ runner.temp }}/screenshots
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with: { path: './_site' }
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: [browser_acceptance, capacity_acceptance]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  capacity_acceptance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save --package-lock=false jszip@3.10.1 @xmldom/xmldom@0.9.12 playwright@1.55.0
      - run: node tests/performance/generate-fixture.mjs
      - uses: actions/download-artifact@v4
        with:
          name: huf-phase7be-curated-site
          path: _site
      - run: npx playwright install --with-deps chromium
      - run: node tests/performance/browser-capacity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huf-pages-capacity-acceptance
          path: /tmp/huf-performance
  live_acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/download-artifact@v4
        with:
          name: huf-phase7be-curated-site
          path: _site
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify every deployed file against the accepted payload
        env:
          HUF_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tests/browser/verify-deployed-files.mjs
      - name: Accept live application end to end
        env:
          HUF_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          HUF_SITE_ROOT: _site
          HUF_SCREENSHOT_DIR: ${{ runner.temp }}/live-screenshots
          HUF_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/phase7be-browser-acceptance.json
        run: node tests/browser/run-imp7b-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huf-live-release-acceptance
          path: |
            deployed-files.runtime.json
            ${{ runner.temp }}/phase7be-browser-acceptance.json
            ${{ runner.temp }}/live-screenshots
